<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <form id="page">
      <table>
        <tr>
          <th>Date</th>
          <th>Expenditures</th>
          <th>Amount Paid</th>
          <th>Categories</th>
        </tr>
        <tr>
          <td><input id="date" type="date" placeholder="Date" /></td>
          <td><input id="title" type="text" placeholder="Title" /></td>
          <td><input id="amount" type="number" placeholder="price" /></td>
          <td>
            <select id="category">
              <option value="food">Food & Drinks</option>
              <option value="groceries">Groceries</option>
              <option value="shopping">Shopping</option>
              <option value="transport">Transport</option>
              <option value="Entertainment">Entertainment</option>
              <option value="utilities">utilities</option>
              <option value="health">Health & Medicines</option>
            </select>
          </td>
          <td id="btn"><button>Add expense</button></td>
        </tr>
      </table>
      <small id="errmsg"></small>
    </form>
    <ul id="list"></ul>
    <h3 id="total"></h3>
    <script src="script.js"></script>
  </body>
</html>
